services:
  - type: web
    name: textshield-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ANALYZER_URL
        value: https://mogestesema-safe-text-model.hf.space/analyze
